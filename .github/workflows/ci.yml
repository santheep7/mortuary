name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mortuary_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: mortuary_ci
      PORT: 3001
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      SMOKE_BASE_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Start server
        working-directory: server
        run: node server.js > server.log 2>&1 &

      - name: Run smoke tests
        working-directory: server
        run: node tests/smoke.js

      - name: Show server log on failure
        if: failure()
        working-directory: server
        run: cat server.log

      - name: Build client
        working-directory: client
        run: npm run build

  # Runs only after `test` passes, and only for pushes to main - a feature
  # branch or PR never triggers a deploy. `runs-on: self-hosted` is the key
  # mechanic: this job executes on our own registered runner (the actual
  # production box), not one of GitHub's cloud runners, since it needs to
  # reach the real server without exposing any SSH credentials to GitHub.
  #
  # NOT active yet - no server exists to register a runner on. Prep only,
  # same as backup-db.sh. Steps assume: Node + PM2 already installed on the
  # box, and the app has been started manually once before (`pm2 start
  # server/server.js --name mortuary-server`) so `pm2 reload` has something
  # to reload.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and build client
        run: |
          cd server && npm install --omit=dev
          cd ../client && npm install && npm run build

      - name: Reload app (zero-downtime)
        run: pm2 reload mortuary-server --update-env

      - name: Health check - roll back on failure
        run: |
          sleep 5
          curl -f http://localhost:3001/api/health || {
            echo "Health check failed - app may be down. Recent logs:";
            pm2 logs mortuary-server --lines 80 --nostream;
            exit 1;
          }
